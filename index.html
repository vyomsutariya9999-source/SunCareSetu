<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun CareSetu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#3A2A20; --navy-2:#5A3A28; --saffron:#E8731A; --amber:#F0A35E; --sun:#F9C74F;
  --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#FBF8F2; --line:#E7E1D6; --line-2:#D9D1C3;
  --ink:#1B2233; --ink-2:#4A5468; --ink-3:#7A8294;
  --crit:#B42318; --crit-bg:#FDECEA; --warn:#A15C07; --warn-bg:#FEF4E6; --info:#9A5A1F; --info-bg:#FBF1E8; --ok:#1E7A4C; --ok-bg:#E7F5EE;
  --accent-soft:#FDF0E4; --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 16px rgba(20,33,61,.06);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --surface:#161E31; --surface-2:#1B2540; --line:#26324F; --line-2:#33416A;
    --ink:#ECEFF6; --ink-2:#B7BFD1; --ink-3:#8790A6;
    --crit:#FF8A80; --crit-bg:#3A1C1E; --warn:#F5B85C; --warn-bg:#3A2A14; --info:#8AB8F5; --info-bg:#172A47; --ok:#6FD3A0; --ok-bg:#143326;
    --accent-soft:#33241A; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#161E31; --surface-2:#1B2540; --line:#26324F; --line-2:#33416A;
  --ink:#ECEFF6; --ink-2:#B7BFD1; --ink-3:#8790A6;
  --crit:#FF8A80; --crit-bg:#3A1C1E; --warn:#F5B85C; --warn-bg:#3A2A14; --info:#8AB8F5; --info-bg:#172A47; --ok:#6FD3A0; --ok-bg:#143326;
  --accent-soft:#33241A; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hi{font-family:'Noto Sans Devanagari','IBM Plex Sans',sans-serif}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--navy);color:#E9ECF4;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand b{font-size:16px;letter-spacing:.2px;color:#fff}
.brand small{display:block;font-size:11px;color:#8A7A70;font-weight:400}
.home-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 12px;font-size:12px;color:#5A4A40}
.home-card strong{display:block;color:#fff;font-size:13px;margin-bottom:2px}
.home-card .pill{margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:#5A4A40;font-size:13.5px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(232,115,26,.18);color:#fff;box-shadow:inset 3px 0 0 var(--saffron)}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:11px;color:#9A8A80;line-height:1.5;padding:0 6px}
.side .foot a{color:#F0A35E}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.topbar h1{font-size:17px;margin:0;font-weight:600}
.topbar .sub{font-size:12px;color:var(--ink-3)}
.tb-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px 28px 60px;max-width:1360px;width:100%}
.proto{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--saffron);background:var(--accent-soft);border-radius:999px;padding:3px 9px;white-space:nowrap}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:#fff}
.btn.primary:hover{background:#D5650F}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-b{padding:16px 18px}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi{padding:14px 16px}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--ink-3)}
.kpi .d{font-size:11.5px;color:var(--ink-2);margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* table */
table.q{width:100%;border-collapse:collapse}
table.q th{text-align:left;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px;padding:10px 14px;border-bottom:1px solid var(--line)}
table.q td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
table.q tr.row{cursor:pointer}
table.q tr.row:hover td{background:var(--surface-2)}
.pname{font-weight:600}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;width:90px}
.bar>i{display:block;height:100%;background:var(--saffron);border-radius:6px}

/* case workspace */
.ws>*,.grid>*{min-width:0}
.tablewrap{overflow-x:auto}
.ws{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.case-head{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.case-head .who{display:flex;gap:14px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--saffron);display:grid;place-items:center;font-weight:700}
.case-head h2{margin:0;font-size:19px}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.step{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.step .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--surface-2);border:1px solid var(--line-2)}
.step.on{border-color:var(--saffron);box-shadow:0 0 0 3px rgba(232,115,26,.12)}
.step.on .n{background:var(--saffron);border-color:var(--saffron);color:#fff}
.step .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.step .badge.crit{background:var(--crit);color:#fff}
.step .badge.warn{background:var(--warn-bg);color:var(--warn)}
.step .badge.ok{background:var(--ok-bg);color:var(--ok)}

.form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 16px}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;font-weight:500;color:var(--ink-2)}
.f .hint{font-size:11.5px;color:var(--ink-3)}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}.c2{grid-column:span 2}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 10px;outline:none;min-height:36px}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{border-color:var(--saffron);box-shadow:0 0 0 3px rgba(232,115,26,.15)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;cursor:pointer;padding:7px 12px;border:1px solid var(--line-2);border-radius:8px;font-size:13px;background:var(--surface)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .seg button.on{background:var(--saffron);border-color:var(--saffron)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:var(--saffron);border-color:var(--saffron)}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--surface);font-size:13px;user-select:none}
.chk input{accent-color:var(--saffron);width:15px;height:15px;margin:0}
.chk.on{border-color:var(--saffron);background:var(--accent-soft)}
.section-t{grid-column:1/-1;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);margin-top:6px;padding-top:10px;border-top:1px dashed var(--line)}
.section-t:first-child{border-top:0;padding-top:0;margin-top:0}
.computed{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:36px;display:flex;align-items:center}
.form-foot{display:flex;justify-content:space-between;margin-top:18px}

/* meds */
.med{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.med:last-of-type{border-bottom:0}
.med .rec{font-size:11.5px;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.iconbtn{all:unset;cursor:pointer;width:32px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--ink-3)}
.iconbtn:hover{background:var(--crit-bg);color:var(--crit)}

/* AI panel */
.ai{position:sticky;top:76px}
.ai-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.ring{width:64px;height:64px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.ai-h .st{font-size:15px;font-weight:600}
.ai-filter{display:flex;gap:6px;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ai-filter button{all:unset;cursor:pointer;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.ai-filter button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.flags{max-height:calc(100vh - 290px);overflow:auto}
.flag{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px}
.flag .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;margin-top:1px}
.flag.crit .ic{background:var(--crit-bg);color:var(--crit)}
.flag.warn .ic{background:var(--warn-bg);color:var(--warn)}
.flag.info .ic{background:var(--info-bg);color:var(--info)}
.flag .t{font-weight:600;font-size:13.5px}
.flag .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.flag .m{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.flag .src{font-size:11px;color:var(--ink-3)}
.flag.done{opacity:.6}
.flag.done .t{text-decoration:line-through}
.ov{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;margin-top:7px}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3)}
.thinking{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3)}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--saffron);animation:pulse 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* review */
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.req{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.req:last-child{border-bottom:0}
.req .s{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none}
.req.y .s{background:var(--ok-bg);color:var(--ok)}
.req.n .s{background:var(--crit-bg);color:var(--crit)}
.brief{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pcard .top{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.pcard .top small{color:#5A4A40}
.pcard ul{margin:0;padding:12px 16px 14px 32px}
.pcard li{margin:4px 0}
.wa{background:#E5DDD5;border-radius:12px;padding:14px;max-width:380px}
:root[data-theme="dark"] .wa{background:#0B141A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa{background:#0B141A}}
.wa .msg{background:#fff;color:#111;border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.1);white-space:pre-wrap}
:root[data-theme="dark"] .wa .msg{background:#202C33;color:#E9EDEF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wa .msg{background:#202C33;color:#E9EDEF}}
.wa .meta{font-size:10.5px;color:#667781;text-align:right;margin-top:4px}
.audit{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--ink-2)}
.audit div{padding:5px 0;border-bottom:1px dashed var(--line)}

/* chat */
.chat{position:fixed;right:20px;bottom:20px;width:380px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100vh - 40px);display:none;flex-direction:column;z-index:30}
.chat.open{display:flex}
.chat .card-h{background:var(--navy);color:#fff;border-radius:var(--radius) var(--radius) 0 0;border:0}
.chat-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.bub{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--saffron);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.sugs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}
.sugs button{all:unset;cursor:pointer;font-size:11.5px;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px}
.chat-in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 var(--radius) var(--radius)}
.fab{position:fixed;right:20px;bottom:20px;z-index:29;border-radius:999px;padding:12px 18px;box-shadow:0 6px 20px rgba(232,115,26,.35)}

.modal{position:fixed;inset:0;background:rgba(10,15,30,.45);display:none;place-items:center;z-index:40;padding:16px}
.modal.open{display:grid}
.modal .card{width:460px;max-width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how h4{margin:0 0 6px;font-size:14px}
.how p{margin:0;color:var(--ink-2);font-size:13px}
.rulelist{columns:2;column-gap:28px;font-size:13px;margin:0;padding-left:18px}
.rulelist li{margin:0 0 6px;break-inside:avoid}
.issues .it{display:grid;grid-template-columns:120px 1fr 36px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.issues .track{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.issues .track i{display:block;height:100%;background:var(--navy);border-radius:6px}
:root[data-theme="dark"] .issues .track i{background:var(--amber)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .issues .track i{background:var(--amber)}}

@media (max-width:1180px){.ws{grid-template-columns:minmax(0,1fr)}.ai{position:static}.flags{max-height:none}.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1180px){#todayGrid{grid-template-columns:1fr !important}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side,.main{min-width:0}
  .nav{min-width:0;flex:1 1 100%;scrollbar-width:none}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 16px;gap:10px}
  .home-card,.side .foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;width:100%}
  .topbar{padding:12px 16px;position:static}
  .content{padding:16px 16px 90px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:repeat(6,minmax(0,1fr))}
  .c2,.c3{grid-column:span 3}.c4,.c6,.c8{grid-column:span 6}.c12{grid-column:1/-1}
  .rv,.how{grid-template-columns:1fr}
  .rulelist{columns:1}
  .med{grid-template-columns:1fr 1fr auto}
  .med>div:first-child{grid-column:span 3}
  table.q .hide-m{display:none}
  table.q td,table.q th{padding:10px 8px}
  .card-h{flex-wrap:wrap;gap:6px}
  .proto,.lg-only{display:none}
  .topbar h1{font-size:15px}
  .topbar .sub{display:none}
}

/* ===== Sun CareSetu theme (orange + blue) ===== */
:root{--navy:#C4500F;--saffron:#EE6A1F;--amber:#F7A541;--bg:#F5F6FA;--info:#D9601A;--accent-soft:#FDEBDD}
.side{background:linear-gradient(180deg,#C4500F,#9A3A0B)}
.nav button.on{background:rgba(247,165,65,.2);box-shadow:inset 3px 0 0 #F7A541}
.topbar{background:linear-gradient(90deg,#E2531A 0%,#F28C28 60%,#F7B354 100%);border-bottom:0}
.topbar h1{color:#fff;font-size:19px}.topbar .sub{color:#FFF1E2}
.topbar .proto{background:#fff;color:#C4500F}.topbar .btn.ghost{color:#fff}
.topbar .btn.primary{background:#C4500F;border-color:#C4500F}
.card-h{background:linear-gradient(90deg,#E2531A,#F7A541);border-radius:var(--radius) var(--radius) 0 0;border-bottom:0}
.card-h h3{color:#fff}.card-h .muted,.card-h .hsub{color:#FFEBD9 !important;font-weight:400}
.card-h .btn{background:rgba(255,255,255,.92);border-color:transparent;color:#C4500F}
.card-h .seg button{background:rgba(255,255,255,.9)}.card-h .seg button.on{background:#C4500F;color:#fff}
.kpi{border-top:3px solid var(--saffron)}
.kpi:nth-child(even){border-top-color:var(--info)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#FFF4EA;border:1px solid #F6D3B6;color:#C4500F;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.sublbl{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#C4500F;margin:6px 0}
.task{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;margin-bottom:5px;background:var(--surface-2);border-left:3px solid var(--line-2);font-size:13px}
.task.crit{border-left-color:var(--crit);background:var(--crit-bg)}.task.warn{border-left-color:var(--warn);background:var(--warn-bg)}.task.info{border-left-color:var(--info)}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}.task .tt{flex:1}.task .due{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.task input{accent-color:var(--saffron)}
.note{display:none;white-space:pre-wrap;font-family:'IBM Plex Mono',monospace;font-size:12px;background:#FFF8F1;border:1px dashed #F1C9A8;border-radius:8px;padding:10px;margin-top:10px}.note.show{display:block}
.mini{font-size:12.5px;padding:6px 9px;border-radius:7px;margin:4px 0}.mini.ok{background:var(--ok-bg);color:var(--ok)}.mini.warn{background:var(--warn-bg);color:var(--warn)}.mini.crit{background:var(--crit-bg);color:var(--crit)}.mini.info{background:var(--info-bg);color:var(--info)}
table.q.mt th{background:#D9601A;color:#fff;border:0}table.q.mt td{padding:7px 10px}
.cp3{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:16px;align-items:start}
.qrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.qrow:hover{background:var(--surface-2)}.qrow.on{background:#FFF4EA;box-shadow:inset 3px 0 0 var(--saffron)}
.tl{display:flex;justify-content:space-between;position:relative;margin:4px 6px 0}.tl:before{content:"";position:absolute;left:8px;right:8px;top:7px;height:2px;background:var(--line-2)}
.tl-i{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-size:11.5px;color:var(--ink-3)}.tl-i i{width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.tl-i.done i{background:var(--ok);border-color:var(--ok)}.tl-i.now i{background:var(--saffron);border-color:var(--saffron);box-shadow:0 0 0 4px rgba(238,106,31,.2)}.tl-i.now span{color:var(--saffron);font-weight:700}
.wa-card{overflow:hidden}.wa-body{background:#E9DFD5;height:360px;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.wm{flex:none;max-width:85%;padding:7px 10px;border-radius:9px;font-size:13px;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.1)}.wm.bot{background:#fff;align-self:flex-start}.wm.me{background:#D9FDD3;align-self:flex-end}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:18px}.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bc i{width:70%;max-width:46px;border-radius:5px 5px 0 0;min-height:3px}.bv{font-size:12px;font-weight:700}.bl{font-size:11.5px;color:var(--ink-3)}
.nrow{display:grid;grid-template-columns:44px 1fr 120px 40px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.nrow b{color:#D9601A}
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(110deg,#C4500F 0%,#D9601A 60%,#F7A541 100%);color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:16px}
.hero h2{margin:4px 0 6px;font-size:24px}.hero p{margin:0;color:#FFF1E2;max-width:760px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#F7B354}
.hero-n{text-align:center;background:rgba(255,255,255,.1);border-radius:12px;padding:12px 20px}.hero-n b{display:block;font-size:34px;color:#F7B354}.hero-n span{font-size:12px;color:#FFF1E2}
.journey{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}
.stage{position:relative;cursor:pointer;background:linear-gradient(135deg,#FFF6EE,#FDE3CC);padding:14px 30px 14px 34px;clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%,20px 50%);margin-right:-12px;transition:transform .15s}
.stage:first-child{clip-path:polygon(0 0,calc(100% - 20px) 0,100% 50%,calc(100% - 20px) 100%,0 100%);padding-left:18px}.stage:hover{transform:translateY(-2px)}
.stage:nth-child(2){background:linear-gradient(135deg,#FDE3CC,#F9C79D)}.stage:nth-child(3){background:linear-gradient(135deg,#F9C79D,#F4A66B)}.stage:nth-child(4){background:linear-gradient(135deg,#F28C28,#E2531A);color:#fff}.stage:nth-child(5){background:linear-gradient(135deg,#D9601A,#C4500F);color:#fff}
.si svg{width:22px;height:22px}.sn{font-size:26px;font-weight:700;line-height:1.1;margin-top:4px}.st{font-weight:600}.ss{font-size:12px;opacity:.85}
.stage.alert .ss{font-weight:700;color:#B42318}.stage:nth-child(4).alert .ss{color:#fff}
.brow{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px}.brow:hover{background:var(--surface-2)}.brow .go{margin-left:auto;color:var(--saffron);font-weight:600;white-space:nowrap;font-size:12.5px}
.bdot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--info)}.brow.crit .bdot{background:var(--crit)}.brow.warn .bdot{background:var(--warn)}.brow.ok .bdot{background:var(--ok)}
.ailist div{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}.ailist b{width:86px;flex:none;color:#C4500F}
@media (max-width:1280px){.cp3{grid-template-columns:1fr 1fr}.cp3 .wa-card{grid-column:span 2}}
@media (max-width:1100px){#homeGrid{grid-template-columns:1fr !important}}
@media (max-width:860px){.cp3{grid-template-columns:1fr}.cp3 .wa-card{grid-column:auto}.journey{grid-template-columns:1fr}.stage,.stage:first-child{clip-path:none;margin:0 0 6px;border-radius:10px;padding:12px 16px}.hero{flex-direction:column;align-items:flex-start}.nrow{grid-template-columns:40px 1fr 70px 36px}}

/* ===== white + orange (no blue) ===== */
:root{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#FFF8F2;--line:#F2E4D8;--line-2:#E8D0BC;--ink:#2B2522;--ink-2:#5C4F47;--ink-3:#8E8079;--info:#9A5A1F;--info-bg:#FBF1E8}
body{background:#fff}
.side{background:#fff;color:#3A2A20;border-right:1px solid #F2E4D8}
.brand b{color:#2B2522}.brand small{color:#8E8079}
.home-card{background:#FFF7F0;border:1px solid #F6D9C2;color:#5C4F47}.home-card strong{color:#2B2522}
.nav button{color:#5C4F47}.nav button:hover{background:#FFF3E8;color:#C4500F}
.nav button.on{background:#FFEBDB;color:#C4500F;box-shadow:inset 3px 0 0 #EE6A1F}
.side .foot{color:#9A8A80}
.topbar .btn.primary{background:#fff;border-color:#fff;color:#C4500F}
.btn.navy{background:#C4500F;border-color:#C4500F}
.seg button.on{background:#EE6A1F;border-color:#EE6A1F;color:#fff}
.pcard .top{background:linear-gradient(90deg,#E2531A,#F7A541)}
.issues .track i{background:#EE6A1F}
.hero{background:linear-gradient(110deg,#C4500F 0%,#EE6A1F 55%,#F7A541 100%)}
.hero .eyebrow{color:#FFE7CF}.hero p{color:#FFF4EA}.hero-n{background:rgba(255,255,255,.18)}.hero-n b{color:#fff}.hero-n span{color:#FFF1E2}
.stage:nth-child(5){background:linear-gradient(135deg,#C4500F,#9A3A0B)}
.card{border-color:#F2E4D8;box-shadow:0 1px 2px rgba(120,60,20,.05),0 4px 14px rgba(120,60,20,.06)}
.kpi:nth-child(even){border-top-color:#F7A541}
.chk.on{background:#FFF3E8}
.ring svg circle:first-child{stroke:#F2E4D8}

/* ===== clearer top bar ===== */
.topbar{padding:12px 24px;gap:16px}
.tb-actions{gap:10px}
.tb-search{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);border-radius:9px;padding:0 10px;height:36px;width:270px;color:#8E8079}
.tb-search svg{width:16px;height:16px;flex:none}.tb-search input{border:0;outline:0;background:transparent;width:100%;min-height:34px;padding:0;font-size:13px;color:#2B2522}
.tb-date{color:#fff;font-size:12.5px;font-weight:500;white-space:nowrap;opacity:.95}
.tb-bell{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:9px;height:34px;padding:0 10px;font-size:12.5px;font-weight:600}
.tb-bell svg{width:16px;height:16px}.tb-bell b{background:#fff;color:#B42318;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;font-size:11px;padding:0 5px}
.tb-bell:hover{background:rgba(255,255,255,.28)}
.tb-user{display:flex;align-items:center;gap:8px;color:#fff;padding-left:6px;border-left:1px solid rgba(255,255,255,.35)}
.tb-user .av{width:32px;height:32px;border-radius:50%;background:#fff;color:#C4500F;display:grid;place-items:center;font-weight:700;font-size:12px}
.tb-user b{display:block;font-size:12.5px;line-height:1.1}.tb-user small{font-size:11px;opacity:.9}
.srch-hit{outline:2px solid #EE6A1F;outline-offset:2px;border-radius:8px}
@media (max-width:1280px){.tb-search{width:200px}.tb-date{display:none}.tb-user .lg-only,.tb-bell .lg-only{display:none}}
.tb-bell,.tb-user,.topbar h1{white-space:nowrap}
@media (max-width:860px){.tb-search{display:none}.tb-user{display:none}}

/* ===== prettier top bar ===== */
.tb-left{flex:1;min-width:220px}.tb-eyebrow,.topbar .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tb-actions{flex:none}
.topbar{background:linear-gradient(90deg,#E2531A,#F28C28 55%,#F7B354) top/100% 4px no-repeat,#FFFFFF;border-bottom:1px solid #F2E4D8;box-shadow:0 4px 18px rgba(196,80,15,.06);padding:14px 28px 12px;min-height:76px}
.tb-eyebrow{font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#E8731A;margin-bottom:2px}.tb-eyebrow span{color:#E8CDB8;margin:0 2px}
.topbar h1{color:#2B2522;font-size:21px;letter-spacing:-.2px}.topbar .sub{color:#8E8079;font-size:12.5px}
.tb-actions{gap:12px}
.tb-search{background:#F8F4F0;border:1px solid #EFE3D8;border-radius:999px;height:40px;padding:0 14px;width:250px;color:#B09A8B;transition:all .15s}
.tb-search:focus-within{background:#fff;border-color:#F2A06A;box-shadow:0 0 0 4px rgba(238,106,31,.12);color:#E8731A}
.tb-search input::placeholder{color:#B5A498}
.tb-date{display:flex;align-items:center;gap:7px;color:#6B5D54;background:#FFF6EE;border:1px solid #F6E2D2;border-radius:999px;height:40px;padding:0 14px;font-size:12.5px;opacity:1}
.tb-date svg{width:15px;height:15px;color:#E8731A}
.tb-bell{position:relative;width:40px;height:40px;padding:0;justify-content:center;border-radius:50%;background:#FFF3E8;border:1px solid #F8D9C0;color:#C4500F}
.tb-bell:hover{background:#FFE7D3}.tb-bell svg{width:18px;height:18px}
.tb-bell b{position:absolute;top:-4px;right:-4px;background:linear-gradient(135deg,#E5484D,#B42318);color:#fff;border:2px solid #fff;min-width:20px;height:20px;font-size:10.5px;box-shadow:0 2px 6px rgba(180,35,24,.35)}
.topbar .btn.primary{background:linear-gradient(135deg,#F28C28,#E2531A);border:0;color:#fff;border-radius:999px;height:40px;padding:0 18px;font-weight:600;box-shadow:0 6px 16px rgba(226,83,26,.28)}
.topbar .btn.primary:hover{filter:brightness(1.05);background:linear-gradient(135deg,#F28C28,#E2531A)}
.tb-user{color:#2B2522;border-left:1px solid #F2E4D8;padding-left:14px;gap:10px;cursor:pointer}
.tb-user .av{position:relative;width:40px;height:40px;background:linear-gradient(135deg,#F7A541,#E2531A);color:#fff;box-shadow:0 0 0 3px #FFE7D3;font-size:13px}
.tb-user .av i{position:absolute;right:0;bottom:0;width:10px;height:10px;border-radius:50%;background:#22A06B;border:2px solid #fff}
.tb-user b{font-size:13px}.tb-user small{color:#8E8079;font-size:11.5px;opacity:1}
.tb-user .chev{width:16px;height:16px;color:#B09A8B}
.brand{min-height:52px}
@media (max-width:1320px){.tb-date{display:none}}@media (max-width:1180px){.tb-search{width:190px}}
@media (max-width:860px){.topbar{padding:12px 16px}.tb-eyebrow{display:none}}

<script>
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v === null || v === undefined || isNaN(+v)) ? null : +v;
const pad = n => String(n).padStart(2,'0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = n => { const d = new Date(); d.setDate(d.getDate()+n); return isoDay(d); };
const fmtDate = s => { if(!s) return '—'; const d = new Date(s+'T00:00'); return d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}); };
const daysUntil = s => { if(!s) return null; const a = new Date(isoDay(new Date())+'T00:00'), b = new Date(s+'T00:00'); return Math.round((b-a)/864e5); };
const nowStamp = () => { const d = new Date(); return `${isoDay(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };

function identify(name){
  const n = ' '+String(name||'').toLowerCase()+' ';
  if(!n.trim()) return null;

/* ============ clinical calculations ============ */
function bmi(c){ const h=num(c.v.h), w=num(c.v.w); return (h&&w)? w/((h/100)**2) : null; }
function egfr(c){ // CKD-EPI 2021, race-free
  const s=num(c.l.creat), age=num(c.p.age); if(!s||!age||!c.p.sex) return null;
  const f = c.p.sex==='F', k = f?0.7:0.9, a = f?-0.241:-0.302;
  return 142*Math.pow(Math.min(s/k,1),a)*Math.pow(Math.max(s/k,1),-1.2)*Math.pow(0.9938,age)*(f?1.012:1);
}
function shiftTime(t, h){ if(!t) return null; const [H,M]=t.split(':').map(Number); let m=H*60+M-h*60; const prev=m<0; m=(m+1440)%1440; const mid=m===0; return {t: mid?'midnight':`${pad(Math.floor(m/60))}:${pad(m%60)}`, prev: prev&&!mid, mid}; }
function eligibleFollow(c){ return c.a.type==='maternity' || c.cm.dm || c.cm.htn || c.cm.cad; }
const operative = c => c.a.type==='surgery' || (c.a.type==='maternity' && /lscs|caesar|cesar|c-section|section/i.test(c.a.proc));
const pregnant = c => c.a.type==='maternity';

/* ============ the sanity-check engine ============ */
function evaluate(c){
  const F=[], R=[];
  const flag=(id,sev,cat,title,detail,src,step)=>F.push({id,sev,cat,title,detail,src,step});
  const req=(label,done,step)=>R.push({label,done:!!done,step});
  const age=num(c.p.age), B=bmi(c), G=egfr(c), op=operative(c), preg=pregnant(c);
  const meds = c.meds.filter(m=>m.n.trim()).map(m=>({...m, id:identify(m.n)}));
  const has = cls => meds.filter(m=>m.id && m.id.c.includes(cls));
  const allergy = (c.v.allergies||'').toLowerCase();

  /* --- identity & documentation --- */
  req('Patient name', c.p.name.trim(), 0);
  req('Age and sex', age && c.p.sex, 0);
  const phoneOk = /^[6-9]\d{9}$/.test(String(c.p.phone).replace(/\D/g,''));
  req('Valid mobile number', phoneOk, 0);
  if(c.p.phone && !phoneOk) flag('phone','warn','Documentation','Mobile number looks wrong','Indian mobile numbers have 10 digits and start with 6–9. Follow-up and reminders depend on it.','Data check',0);
  req('Caregiver name and phone', c.p.cgName.trim() && /^[6-9]\d{9}$/.test(String(c.p.cgPhone).replace(/\D/g,'')), 0);
  if(c.p.abha && String(c.p.abha).replace(/\D/g,'').length!==14) flag('abha','info','Documentation','ABHA number should have 14 digits','ABHA is voluntary; leave blank if the patient has none.','ABDM format',0);
  req('Procedure / reason for admission', c.a.proc.trim(), 1);
  req('Admitting doctor', c.a.doctor.trim(), 1);
  req('Allergy status recorded', c.v.allergies.trim(), 2);
  if(!c.v.allergies.trim()) flag('allergy-missing','warn','Documentation','Allergy status not recorded','Write the allergy and reaction, or "None known". Missing allergy status is one of the most common documentation gaps.','Documentation standard',2);
  req('Medicines reconciled', meds.length || c.noMeds, 4);
  req('ID proof copied', c.docs.id, 5);
  const anyCm = Object.values(c.cm).some(Boolean);
  if(anyCm) req('Previous records / prescriptions attached', c.docs.records, 5);
  req('Cost estimate shared with family', c.docs.estimate, 5);

  /* --- vitals --- */
  req('Height and weight', B, 2);
  req('Blood pressure, pulse, SpO₂', num(c.v.sbp)&&num(c.v.dbp)&&num(c.v.pulse)&&num(c.v.spo2), 2);
  const sbp=num(c.v.sbp), dbp=num(c.v.dbp);
  if(sbp&&dbp){
    if(preg){
      if(sbp>=160||dbp>=110) flag('bp','crit','Clinical',`Severe-range BP in pregnancy (${sbp}/${dbp})`,'Needs urgent obstetrician review today, not routine admission.','Obstetric BP thresholds',2);
      else if(sbp>=140||dbp>=90) flag('bp','warn','Clinical',`Raised BP in pregnancy (${sbp}/${dbp})`,'Check urine protein and symptoms; obstetrician to confirm the plan for hypertension in pregnancy.','Obstetric BP thresholds',2);
    } else if(op){
      if(sbp>=180||dbp>=110) flag('bp','crit','Clinical',`BP ${sbp}/${dbp} before elective surgery`,'At or above 180/110, elective surgery is usually deferred. Anaesthetist to review.','Pre-op BP guidance',2);
      else if(sbp>=160||dbp>=100) flag('bp','warn','Clinical',`BP ${sbp}/${dbp} before surgery`,'Recheck after rest; anaesthetist to review control.','Pre-op BP guidance',2);
    } else if(sbp>=180||dbp>=110) flag('bp','crit','Clinical',`Very high BP (${sbp}/${dbp})`,'Inform the admitting doctor on arrival; recheck after rest.','BP thresholds',2);
  }
  const spo2=num(c.v.spo2);
  if(spo2!==null){ if(spo2<90) flag('spo2','crit','Clinical',`SpO₂ ${spo2}%`,'Low oxygen saturation: doctor to assess before admission.','Vital-sign threshold',2); else if(spo2<94) flag('spo2','warn','Clinical',`SpO₂ ${spo2}%`,'Below 94%: recheck and inform the doctor.','Vital-sign threshold',2); }
  const pulse=num(c.v.pulse);
  if(pulse!==null && (pulse>110||pulse<50)) flag('pulse','warn','Clinical',`Pulse ${pulse}/min`,'Outside the usual range: recheck and inform the doctor.','Vital-sign threshold',2);
  if(B){ if(B>=40) flag('bmi','warn','Clinical',`BMI ${B.toFixed(1)}`,'Severe obesity: anaesthesia review and airway planning.','Anaesthesia risk',2); else if(B>=35&&op) flag('bmi','warn','Clinical',`BMI ${B.toFixed(1)}`,'Anaesthetist to review airway and positioning.','Anaesthesia risk',2); }
  if(op && age>=65) flag('age','info','Clinical','Older patient (65+)','Screen for delirium and fall risk on admission; involve family.','Geriatric care',2);
  if(op && c.cm.cad) flag('cad','warn','Clinical','Heart disease before surgery','Cardiac / anaesthesia review before the day of surgery.','Pre-op assessment',2);
  if(op && ['GA','Spinal'].includes(c.a.anaes)){
    const n=num(c.v.npo);
    if(n===null) flag('npo','warn','Documentation','Fasting plan not set','Record fasting instructions so the patient card and WhatsApp message carry the right times.','Pre-op instructions',2);
    else if(n<6) flag('npo','warn','Clinical',`Fasting planned for only ${n} h`,'General guide: no solid food for 6 hours before anaesthesia. Anaesthetist decides.','ASA fasting guidance',2);
  }

  /* --- maternity specifics --- */
  if(preg){
    const ga=num(c.a.ga);
    req('Gestational age recorded', ga, 1);
    if(ga && op && ga<39 && /elective/i.test(c.a.proc)) flag('ga','warn','Clinical',`Elective caesarean at ${ga} weeks`,'Planned caesarean before 39 weeks needs the medical indication documented.','Obstetric practice',1);
    if(c.a.prevCS) flag('prevcs','info','Clinical','Previous caesarean','Confirm the plan (repeat CS or trial of labour) and that blood is arranged.','Obstetric practice',1);
    if(c.a.gdm) flag('gdm','info','Clinical','Gestational diabetes','Plan newborn sugar checks; mother needs a glucose test after delivery (eligible for 90-day follow-up).','GDM care pathway',1);
    if(/[-−]/.test(c.l.bg)) flag('rh','warn','Clinical','Rh-negative mother','Check antibody screen and keep the anti-D plan ready for after delivery.','Obstetric practice',3);
  }

  /* --- investigations --- */
  const L=c.l, needs=[];
  const want=(k,label,cond=true)=>{ if(!cond) return; const v=L[k]; const done = v!=='' && v!==null && v!=='Not done'; req(label, done, 3); if(!done) needs.push(label); };
  if(op || preg){
    want('hb','Haemoglobin'); want('plt','Platelets'); want('bg', preg?'Blood group and Rh':'Blood group');
    want('rbs','Blood sugar'); want('hiv','HIV'); want('hbsag','HBsAg'); want('hcv','HCV', op);
    want('creat','Creatinine', !preg && (age>=50||c.cm.dm||c.cm.htn||c.cm.ckd));
    want('ecg','ECG', !preg && (age>=40||c.cm.cad||c.cm.htn||c.cm.dm));
    want('hba1c','HbA1c', c.cm.dm && !preg);
  } else {
    want('hb','Haemoglobin'); want('rbs','Blood sugar'); want('creat','Creatinine'); want('ecg','ECG', c.cm.cad||age>=40);
  }
  if(needs.length) flag('labs-missing', op?'warn':'info','Investigations',`${needs.length} investigation${needs.length>1?'s':''} pending`,`Not yet done or not entered: ${needs.join(', ')}.`,'Pre-admission checklist',3);
  const hb=num(L.hb);
  if(hb!==null){
    if(preg){ if(hb<7) flag('hb','crit','Clinical',`Severe anaemia (Hb ${hb})`,'Hb below 7 in pregnancy: obstetrician to plan correction and blood before delivery.','WHO anaemia in pregnancy',3);
      else if(hb<10) flag('hb','warn','Clinical',`Moderate anaemia (Hb ${hb})`,'Hb 7–9.9 in pregnancy: arrange cross-matched blood; plan iron after delivery.','WHO anaemia in pregnancy',3);
      else if(hb<11) flag('hb','info','Clinical',`Mild anaemia (Hb ${hb})`,'Continue iron; recheck after delivery.','WHO anaemia in pregnancy',3); }
    else if(op){ if(hb<8) flag('hb','crit','Clinical',`Hb ${hb} before surgery`,'Low haemoglobin: surgeon/anaesthetist to decide on correction before elective surgery.','Pre-op assessment',3); else if(hb<10) flag('hb','warn','Clinical',`Hb ${hb} before surgery`,'Arrange blood availability; doctor to review.','Pre-op assessment',3); }
    else if(hb<8) flag('hb','warn','Clinical',`Hb ${hb}`,'Low haemoglobin: inform the admitting doctor.','Lab threshold',3);
  }
  const plt=num(L.plt);
  if(plt!==null && (op||preg)){ if(plt<50) flag('plt','crit','Clinical',`Platelets ${plt}k`,'Too low for surgery or spinal anaesthesia without review.','Anaesthesia safety',3); else if(plt<100) flag('plt','warn','Clinical',`Platelets ${plt}k`,'Below 100k: anaesthetist to confirm spinal is safe.','Anaesthesia safety',3); }
  const rbs=num(L.rbs), a1c=num(L.hba1c);
  if(rbs!==null){ if(rbs>=300) flag('rbs','crit','Clinical',`Blood sugar ${rbs} mg/dL`,'Very high: doctor to review today; check ketones.','Glycaemic threshold',3); else if(rbs>=200) flag('rbs','warn','Clinical',`Blood sugar ${rbs} mg/dL`,'High: plan sugar monitoring and control around admission.','Glycaemic threshold',3); }
  if(a1c!==null && op && a1c>=8.5) flag('a1c','warn','Clinical',`HbA1c ${a1c}%`,'Poor long-term control before elective surgery: doctor to decide whether to optimise first. Higher wound-infection risk.','Peri-operative diabetes care',3);
  if(G!==null){ if(G<30) flag('egfr','crit','Clinical',`eGFR ${Math.round(G)} (creatinine ${L.creat})`,'Severely reduced kidney function: review all medicine doses; avoid NSAIDs and contrast.','CKD-EPI 2021',3); else if(G<60) flag('egfr','info','Clinical',`eGFR ${Math.round(G)} (creatinine ${L.creat})`,'Reduced kidney function: check doses of renally cleared medicines.','CKD-EPI 2021',3); }
  ['hiv','hbsag','hcv'].forEach(k=>{ if(L[k]==='Reactive') flag('viral-'+k,'warn','Clinical',`${k==='hbsag'?'HBsAg':k.toUpperCase()} reactive`,'Inform the OT/labour-room team for precautions; confidential counselling and linkage to care.','Infection control',3); });
  if(L.ecg==='Abnormal') flag('ecg','warn','Clinical','Abnormal ECG','Doctor / cardiologist to review before the procedure.','Pre-op assessment',3);

  /* --- medicines --- */
  meds.filter(m=>m.id && !m.id.g).forEach((m,i)=>flag('unk-'+i,'info','Medication',`Couldn't identify "${m.n}"`,'Pharmacist to verify the generic name and dose.','Medicine reconciliation',4));
  const dupCls=['biguanide','sulfonylurea','arb','acei','statin','ppi','nsaid','anticoag','p2y12'];
  dupCls.forEach(cl=>{ const h=has(cl); if(h.length>1) flag('dup-'+cl,'warn','Medication',`Possible duplicate: two ${CLASS_NAME[cl]}s`,`${h.map(m=>`${m.n} (${m.id.g})`).join(' and ')} contain the same class. Prescriber to confirm both are intended.`,'Duplicate-therapy check',4); });
  if(has('acei').length && has('arb').length) flag('ras','warn','Medication','ACE inhibitor with ARB','Dual RAS blockade raises potassium and kidney risk. Prescriber review.','Interaction check',4);
  if((has('acei').length||has('arb').length) && has('ksparing').length) flag('k','warn','Medication','ACE inhibitor/ARB with spironolactone','Risk of high potassium: check serum potassium.','Interaction check',4);
  if(has('p2y12').length && has('cyp2c19ppi').length) flag('ppi-clop','warn','Medication','Clopidogrel with omeprazole/esomeprazole',`${has('cyp2c19ppi').map(m=>m.n).join(', ')} can reduce clopidogrel's effect (CYP2C19). Prescriber to review the choice of PPI.`,'Interaction check',4);
  if(has('nsaid').length && (has('anticoag').length||has('antiplatelet').length)) flag('nsaid-bleed','warn','Medication','Painkiller (NSAID) with a blood thinner',`${has('nsaid').map(m=>m.n).join(', ')} with ${[...has('anticoag'),...has('antiplatelet')].map(m=>m.n).join(', ')}: higher bleeding risk.`,'Interaction check',4);
  if(has('nsaid').length && G!==null && G<60) flag('nsaid-kid','warn','Medication','NSAID with reduced kidney function','NSAIDs can worsen kidney function. Prescriber review.','Interaction check',4);
  if(has('nitrate').length && has('pde5').length) flag('nit-pde','crit','Medication','Nitrate with sildenafil/tadalafil','Dangerous fall in blood pressure. Stop and inform the doctor.','Interaction check',4);
  if(op && (has('anticoag').length||has('antiplatelet').length)) flag('thin-op','warn','Medication','Blood thinner before a procedure',`${[...has('anticoag'),...has('antiplatelet')].map(m=>m.n).join(', ')}: surgeon and anaesthetist to write a stop/continue plan (bleeding and spinal risk). Setu does not advise stopping.`,'Peri-operative medicines',4);
  if(op && (has('sulfonylurea').length||has('insulin').length)) flag('hypo','info','Medication','Fasting with sugar-lowering medicine',`${[...has('sulfonylurea'),...has('insulin')].map(m=>m.n).join(', ')}: plan sugar checks while fasting; doctor to adjust the morning dose.`,'Peri-operative diabetes care',4);
  if(has('biguanide').length && G!==null){ if(G<30) flag('met-egfr','crit','Medication',`Metformin with eGFR ${Math.round(G)}`,'Metformin is not advised below eGFR 30. Prescriber review.','Renal dosing',4); else if(G<45) flag('met-egfr','warn','Medication',`Metformin with eGFR ${Math.round(G)}`,'Dose review needed at eGFR 30–45.','Renal dosing',4); }
  if(op && (has('acei').length||has('arb').length)) flag('ras-op','info','Medication','ACE inhibitor/ARB on the day of surgery','Anaesthetist to decide whether to give the morning dose.','Peri-operative medicines',4);
  if(preg){ const bad=[...has('acei'),...has('arb'),...has('statin'),...has('vka')]; if(bad.length) flag('preg-drug','crit','Medication','Medicine not recommended in pregnancy',`${bad.map(m=>m.n).join(', ')}: prescriber to review now.`,'Pregnancy safety',4); }
  if(/penicillin|amoxi|ampicillin/.test(allergy)){
    const pen=[...has('penicillin')]; const proph=identify(c.a.prophylaxis);
    if(pen.length || (proph&&proph.c.includes('penicillin'))) flag('allergy-pen','crit','Medication','Penicillin allergy with a penicillin-group antibiotic',`Allergy recorded: "${c.v.allergies}". Do not give until the doctor changes the order.`,'Allergy cross-check',4);
    if(has('cephalosporin').length || (proph&&proph.c.includes('cephalosporin'))) flag('allergy-ceph','warn','Medication','Penicillin allergy with a cephalosporin',`Planned: ${c.a.prophylaxis||has('cephalosporin').map(m=>m.n).join(', ')}. Confirm the reaction type (rash vs anaphylaxis) with the doctor before the first dose.`,'Allergy cross-check',1);
  }

  /* --- payer --- */
  const du = daysUntil(c.a.date);
  if(c.pay.mode==='pmjay'){
    if(!state.home.pmjay) flag('pmjay-emp','crit','Payer','This home is not PM-JAY empanelled','PM-JAY cases can only be treated cashless at empanelled hospitals. Refer to an empanelled hospital or agree cash payment in writing.','NHA empanelment rules',5);
    req('PM-JAY beneficiary verified (e-card)', c.pay.ecard, 5);
    req('Aadhaar copy for PM-JAY', c.pay.aadhaar, 5);
    if(!c.pay.ecard) flag('pmjay-ecard','warn','Payer','PM-JAY beneficiary not verified','Verify the beneficiary and generate the e-card at the Arogya Mitra desk before admission.','PM-JAY process',5);
    req('PM-JAY pre-authorisation raised', c.pay.preauth!=='Not started', 5);
    if(c.pay.preauth==='Not started') flag('pmjay-preauth','warn','Payer','PM-JAY pre-authorisation not raised',`Planned procedure${du!==null?` in ${du} day${du===1?'':'s'}`:''}: raise pre-auth for the "${c.pay.pkg||'?'}" package now.`,'PM-JAY process',5);
  }
  if(c.pay.mode==='insurance'){
    req('Insurer and policy number', c.pay.insurer.trim() && c.pay.policy.trim(), 5);
    req('Cashless pre-authorisation submitted', c.pay.preauth!=='Not started', 5);
    if(c.pay.preauth==='Not started') flag('ins-preauth', (du!==null&&du<=2)?'warn':'info','Payer','Cashless pre-authorisation not submitted',`Admission ${du===0?'today':du===1?'tomorrow':`in ${du} days`}. Planned admissions usually need advance intimation to the insurer/TPA; check the policy.`,'Insurer process',5);
  }

  /* --- consents --- */
  req('General admission consent', c.cons.general, 5);
  if(op || preg) req('Procedure-specific consent', c.cons.proc, 5);
  if(['GA','Spinal'].includes(c.a.anaes)) req('Anaesthesia consent', c.cons.anaes, 5);
  const crits = F.filter(f=>f.sev==='crit');
  if(crits.length || (op && age>=65)) { req('High-risk consent', c.cons.high, 5); if(!c.cons.high) flag('high-consent','warn','Consent','High-risk consent needed',`${crits.length?`${crits.length} critical flag${crits.length>1?'s':''} open`:'Patient 65+ having a procedure'}: take an informed high-risk consent in the patient's language.`,'Consent standard',5); }
  req('DPDP data consent (itemised)', c.cons.dpdp, 5);
  if(!c.cons.dpdp) flag('dpdp','warn','Consent','Data-protection consent not recorded','Under the DPDP Act, record itemised consent (care, WhatsApp follow-up, anonymised data) with an easy way to withdraw.','DPDP Act and Rules 2025',5);
  if(eligibleFollow(c) && !c.cons.follow) flag('follow','info','Continuity','Eligible for 90-day follow-up','Offer CareSetu follow-up now; enrolment completes at discharge. Free for the patient.','CareSetu Companion',5);

  /* --- status --- */
  F.forEach(f=>{ f.reviewed = c.overrides[f.id] || null; });
  const done = R.filter(r=>r.done).length, score = R.length? Math.round(done/R.length*100):0;
  const openCrit = F.filter(f=>f.sev==='crit' && !f.reviewed).length;
  const openWarn = F.filter(f=>f.sev==='warn' && !f.reviewed).length;
  const status = openCrit? 'Not ready' : (score<100||openWarn)? 'Needs attention' : 'Ready';
  const order={crit:0,warn:1,info:2};
  const catO={Medication:0,Clinical:1,Payer:2,Consent:3,Investigations:4,Documentation:5,Continuity:6};
  F.sort((x,y)=> (!!x.reviewed - !!y.reviewed) || order[x.sev]-order[y.sev] || (catO[x.cat]??9)-(catO[y.cat]??9));
  return {flags:F, reqs:R, score, status, openCrit, openWarn, info:F.filter(f=>f.sev==='info'&&!f.reviewed).length, meds, bmi:B, egfr:G};
}

    ${f('Allergies and reaction','v.allergies',{type:'textarea',w:'c12',ph:'e.g. Penicillin (rash) — or write "None known"'})}
  </div>`; }

    return `<div class="form">

    ${f('Blood group','l.bg',{type:'select',options:['','A+','A−','B+','B−','AB+','AB−','O+','O−'],w:'c3'})}${f('ECG','l.ecg',{type:'select',options:['','Not done','Normal','Abnormal'],w:'c3'})}
    ${f('HIV','l.hiv',{type:'select',options:['','Not done','Non-reactive','Reactive'],w:'c4'})}${f('HBsAg','l.hbsag',{type:'select',options:['','Not done','Non-reactive','Reactive'],w:'c4'})}${f('HCV','l.hcv',{type:'select',options:['','Not done','Non-reactive','Reactive'],w:'c4'})}

  </div>`; }
  if(s===5) return `<div class="form">
    ${seg('Who pays','pay.mode',[['cash','Cash'],['insurance','Private insurance (cashless)'],['pmjay','PM-JAY (Ayushman Bharat)']])}

    <div class="section-t">Continuity</div>
    <div class="f c12">${eligibleFollow(c)?`<div class="checks">${chk('Patient agreed to CareSetu 90-day follow-up (WhatsApp + coordinator calls)','cons.follow')}</div><span class="hint">Free for the patient. Runs under ${esc(state.home.name)}'s name; the patient's own doctor stays in charge.</span>`:'<span class="hint">Not in the 90-day follow-up pathway (offered to chronic and maternity patients).</span>'}</div>

function recHtml(id){
  if(!id) return '';
  if(!id.g) return '<span class="tag" style="color:var(--warn)">Not recognised: pharmacist to verify</span>';
  return `<span class="tag">${esc(id.g)}</span>${id.c.filter(x=>CLASS_NAME[x]).map(x=>`<span class="tag">${CLASS_NAME[x]}</span>`).join('')}`;
}
function viewCase(){
  const c=cur(), e=evaluate(c);
  const stepFlags = i => e.flags.filter(fl=>fl.step===i && !fl.reviewed);
  return `<div class="case-head"><div class="who"><div class="avatar">${esc((c.p.name||'?').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div><h2>${esc(c.p.name||'New patient')}</h2><div class="small muted">${[c.p.age&&`${c.p.age} ${c.p.sex}`,typeName(c.a.type),c.a.proc,c.a.date&&`${fmtDate(c.a.date)} ${c.a.time}`,payName(c)].filter(Boolean).map(esc).join(' · ')}</div></div></div>
    <div style="display:flex;gap:8px"><button class="btn sm" data-nav="queue">← Back</button><button class="btn sm navy" data-act="go" data-s="6">Review & sign-off</button></div></div>
  <div class="ws"><div>
    <div class="steps">${STEPS.map((s,i)=>{ const fl=stepFlags(i); const cr=fl.filter(x=>x.sev==='crit').length, w=fl.filter(x=>x.sev==='warn').length;
      return `<button class="step ${state.step===i?'on':''}" data-act="go" data-s="${i}"><span class="n">${i+1}</span>${s}${i<6?(cr?`<span class="badge crit">${cr}</span>`:w?`<span class="badge warn">${w}</span>`:''):''}</button>`; }).join('')}</div>
    <div class="card"><div class="card-b" id="stepBody">${stepBody(state.step)}</div></div>
    ${state.step<6?`<div class="form-foot"><button class="btn" data-act="go" data-s="${Math.max(0,state.step-1)}" ${state.step===0?'disabled':''}>← Previous</button><button class="btn primary" data-act="go" data-s="${state.step+1}">${state.step===5?'Review & sign-off →':'Next →'}</button></div>`:''}
  </div>
  <aside class="card ai" id="aiPanel"></aside></div>`;
}
function renderPanel(){
  const c=cur(); if(!c) return; const e=evaluate(c);
  const pct=e.score, r=27, C=2*Math.PI*r;
  const col = e.status==='Ready'?'var(--ok)':e.status==='Not ready'?'var(--crit)':'var(--warn)';
  const list = e.flags.filter(fl=> state.filter==='all' || fl.sev===state.filter);
  $('#aiPanel').innerHTML = `
   <div class="ai-h"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="${r}" stroke="var(--line)" stroke-width="7" fill="none"/><circle cx="32" cy="32" r="${r}" stroke="${col}" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><b>${pct}%</b></div>
     <div style="min-width:0"><div class="small muted">✦ Setu sanity check</div><div class="st">${c.finalized?'Signed off':e.status}</div><div class="small muted">${e.reqs.filter(x=>x.done).length}/${e.reqs.length} checklist items · ${state.thinking?'<span class="thinking"><i></i><i></i><i></i> re-checking</span>':'checked just now'}</div></div></div>
   <div class="ai-filter">${[['all',`All ${e.flags.length}`],['crit',`Critical ${e.flags.filter(x=>x.sev==='crit').length}`],['warn',`Review ${e.flags.filter(x=>x.sev==='warn').length}`],['info',`Notes ${e.flags.filter(x=>x.sev==='info').length}`]].map(([k,l])=>`<button class="${state.filter===k?'on':''}" data-filter="${k}">${l}</button>`).join('')}</div>
   <div class="flags">${list.length? list.map(fl=>`<div class="flag ${fl.sev} ${fl.reviewed?'done':''}"><div class="ic">${fl.sev==='crit'?'!':fl.sev==='warn'?'?':'i'}</div><div>
      <div class="t">${esc(fl.title)}</div><div class="d">${esc(fl.detail)}</div>
      ${fl.reviewed?`<div class="ov">✓ ${esc(fl.reviewed.by)} · ${esc(fl.reviewed.at)}<br>${esc(fl.reviewed.reason)}</div>`:''}
      <div class="m"><span class="pill neutral">${fl.cat}</span><span class="src">Rule: ${esc(fl.src)}</span>
      ${!fl.reviewed && fl.sev!=='info'?`<button class="btn sm" data-act="review" data-id="${fl.id}">Doctor review</button>`:''}
      ${state.step!==fl.step?`<button class="btn sm ghost" data-act="go" data-s="${fl.step}">Go to field</button>`:''}</div></div></div>`).join('') : `<div class="empty">${state.filter==='all'?'No flags. Everything Setu checks looks fine.':'Nothing in this filter.'}</div>`}</div>`;
}

const HI = {
  title:'भर्ती से पहले आपकी जानकारी', date:'भर्ती', doctor:'डॉक्टर',
  solids:(t,p)=>`${t==='midnight'?'आधी रात (12 बजे)':(p?'पिछली रात ':'')+t} के बाद कुछ भी ठोस न खाएं।`, water:t=>`${t} तक केवल साफ़ पानी पी सकते हैं, जब तक डॉक्टर कुछ और न कहें।`,
  bring:'साथ लाएं: आधार कार्ड, बीमा/आयुष्मान कार्ड, पुरानी रिपोर्ट और सभी दवाइयाँ।',
  ask:m=>`इन दवाइयों के बारे में डॉक्टर से पूछें, खुद से बंद न करें: ${m}`,
  meds:'अपनी सभी दवाइयाँ साथ लाएं। कौन-सी दवा लेनी है, डॉक्टर बताएंगे।',
  call:p=>`कोई सवाल हो तो कॉल करें: ${p}`,
  follow:'छुट्टी के बाद 90 दिन तक हमारी टीम आपसे WhatsApp और फ़ोन पर संपर्क में रहेगी — मुफ़्त।',
  danger:'खून बहना, तेज़ बुखार, साँस फूलना या सीने में दर्द हो तो तुरंत अस्पताल आएं।'
};
function patientLines(c, lang){
  const e=evaluate(c); const n=num(c.v.npo); const s=n?shiftTime(c.a.time,n):null, w=n?shiftTime(c.a.time,2):null;
  const ask=[...new Set(e.flags.filter(f=>f.cat==='Medication'&&/thinner|fasting|metformin|ACE|duplicate|clopidogrel/i.test(f.title)).flatMap(f=>e.meds.filter(m=>f.detail.includes(m.n)).map(m=>m.n)))];
  const phone='0712-2554 300';
  if(lang==='hi') return {title:HI.title, lines:[`${HI.date}: ${fmtDate(c.a.date)}, ${c.a.time} · ${HI.doctor}: ${c.a.doctor||'—'}`, ...(s?[HI.solids(s.t,s.prev),HI.water(w.t)]:[]), HI.bring, ask.length?HI.ask(ask.join(', ')):HI.meds, ...(c.cons.follow?[HI.follow]:[]), HI.danger, HI.call(phone)]};
  return {title:'Before your admission', lines:[`Admission: ${fmtDate(c.a.date)}, ${c.a.time} · Doctor: ${c.a.doctor||'—'}`, ...(s?[`Do not eat solid food after ${s.t}${s.prev?' the night before':''}.`,`You may drink clear water until ${w.t}, unless the doctor says otherwise.`]:[]), 'Bring: Aadhaar, insurance / Ayushman card, old reports and all your medicines.', ask.length?`Ask the doctor about these medicines — do not stop them on your own: ${ask.join(', ')}`:'Bring all your medicines. The doctor will tell you which to take.', ...(c.cons.follow?['After discharge our team stays in touch for 90 days on WhatsApp and phone — free.']:[]), 'Come in at once for bleeding, high fever, breathlessness or chest pain.', `Questions? Call ${phone}`]};
}
function brief(c){
  const e=evaluate(c);
  const cm=Object.entries({dm:'diabetes',htn:'hypertension',cad:'heart disease',asthma:'asthma/COPD',ckd:'kidney disease',thyroid:'thyroid'}).filter(([k])=>c.cm[k]).map(([,v])=>v);
  const L=c.l; const labs=[L.hb&&`Hb ${L.hb}`,L.plt&&`plt ${L.plt}k`,L.rbs&&`RBS ${L.rbs}`,L.hba1c&&`HbA1c ${L.hba1c}%`,L.creat&&`creat ${L.creat}${e.egfr?` (eGFR ${Math.round(e.egfr)})`:''}`,L.bg&&`group ${L.bg}`,L.ecg&&`ECG ${L.ecg.toLowerCase()}`].filter(Boolean).join(', ');
  const open=e.flags.filter(f=>!f.reviewed&&f.sev!=='info');
  return `${c.p.name||'Patient'}, ${c.p.age||'?'} ${c.p.sex||''} — ${typeName(c.a.type).toLowerCase()}: ${c.a.proc||'—'}${c.a.type==='maternity'&&c.a.ga?` at ${c.a.ga} weeks`:''}, ${fmtDate(c.a.date)} ${c.a.time}${c.a.anaes&&c.a.anaes!=='None'?`, ${c.a.anaes}`:''} (${c.a.doctor||'doctor not set'}).
Conditions: ${cm.join(', ')||'none recorded'}. Allergies: ${c.v.allergies||'NOT RECORDED'}.
Vitals: BP ${c.v.sbp||'?'}/${c.v.dbp||'?'}, pulse ${c.v.pulse||'?'}, SpO₂ ${c.v.spo2||'?'}%${e.bmi?`, BMI ${e.bmi.toFixed(1)}`:''}.
Labs: ${labs||'none entered'}.
Medicines (${e.meds.length}): ${e.meds.map(m=>`${m.n}${m.id&&m.id.g?` [${m.id.g}]`:''}`).join('; ')||(c.noMeds?'none':'not reconciled')}.
Payer: ${payName(c)}${c.pay.mode!=='cash'?`, pre-auth ${c.pay.preauth.toLowerCase()}`:''}.

For your decision (${open.length}):
${open.map((f,i)=>`${i+1}. ${f.sev==='crit'?'[CRITICAL] ':''}${f.title} — ${f.detail}`).join('\n')||'Nothing open.'}

Checklist ${e.score}% complete. Prepared by Setu; clinical decisions rest with the treating doctor.`;
}
function viewReview(){

      <div class="wa"><div class="msg ${state.lang==='hi'?'hi':''}">${esc(`${state.home.name}\n${pl.title}\n\n`+pl.lines.slice(0,4).join('\n'))}</div><div class="meta">${esc(state.home.name)} Care Connect · ✓✓</div></div>

function cpRisk(p){
  let s=0, why=[];
  if(p.flags.some(f=>f.sev==='crit')){ s+=60; why.push('red-flag message'); }
  if(p.pdc<80){ s+=20; why.push(`adherence ${p.pdc}%`); }
  if(/ended|overdue/i.test(p.refill)){ s+=15; why.push('refill missed'); }
  const arr=p.bp||p.sug||[]; if(arr.length>2 && arr.at(-1)-arr[0]>15){ s+=15; why.push(p.bp?'BP rising':'sugar rising'); }
  if(p.thread.some(m=>/no reply/.test(m[1]))){ s+=10; why.push('no reply'); }
  if([3,7,30,42,90].some(d=>Math.abs(p.day-d)<=1)){ s+=8; why.push(`Day ${p.day} touchpoint`); }
  return {s:Math.min(99,s), why, level:s>=50?'High':s>=25?'Medium':'Low'};
}
function spark(arr, hi){ if(!arr||!arr.length) return ''; const w=180,h=46,mn=Math.min(...arr)-8,mx=Math.max(...arr)+8; const pts=arr.map((v,i)=>`${(i/(arr.length-1))*w},${h-(v-mn)/(mx-mn)*h}`).join(' ');
  const yh=h-(hi-mn)/(mx-mn)*h; return `<svg width="${w}" height="${h+4}" viewBox="0 -2 ${w} ${h+4}"><line x1="0" x2="${w}" y1="${yh}" y2="${yh}" stroke="var(--crit)" stroke-dasharray="3 3" stroke-width="1"/><polyline points="${pts}" fill="none" stroke="var(--info)" stroke-width="2"/>${arr.map((v,i)=>`<circle cx="${(i/(arr.length-1))*w}" cy="${h-(v-mn)/(mx-mn)*h}" r="2.5" fill="var(--info)"/>`).join('')}</svg>`; }
const TRIAGE=[
  {re:/chest|सीने|छाती|heaviness|भारी|breath|साँस|सांस|faint|बेहोश|unconscious/i, sev:'crit', reply:'This could be serious. Please call 108 now or come to the nursing home immediately. I have alerted your doctor and coordinator.', tag:'Possible cardiac / breathing emergency'},
  {re:/bleed|खून|fever|बुखार|pus|पस|wound|टांक/i, sev:'crit', reply:'Please come to the nursing home today. I have informed the doctor and your coordinator will call you within 15 minutes.', tag:'Post-op / maternal red flag'},
  {re:/bp\s*(\d{2,3})\s*\/\s*(\d{2,3})/i, sev:'bp'},
  {re:/sugar\s*(\d{2,3})|शुगर\s*(\d{2,3})/i, sev:'sugar'},
  {re:/miss|भूल|forgot|nahi li|नहीं ली|❌/i, sev:'warn', reply:'Thank you for telling us. Please do not take a double dose. Your coordinator will call you today to help plan your doses.', tag:'Missed dose'},
  {re:/refill|दवा खत्म|khatam|pack/i, sev:'warn', reply:'Your value pack is ready at your nearby chemist. Shall we ask them to keep it for you? (Yes / No)', tag:'Refill'},
];
function triage(p, msg){
  p.thread.push(['me',msg]);
  for(const r of TRIAGE){ const m=msg.match(r.re); if(!m) continue;
    if(r.sev==='bp'){ const sy=+m[1], di=+m[2]; (p.bp=p.bp||[]).push(sy); if(sy>=180||di>=110){ p.flags.push({sev:'crit',t:`BP ${sy}/${di} reported`,at:nowStamp()}); p.thread.push(['ai',`BP ${sy}/${di} is very high. Please sit and rest, recheck in 15 minutes. I have alerted your doctor; your coordinator will call now.`]); }
      else if(sy>=150||di>=95){ p.flags.push({sev:'warn',t:`BP ${sy}/${di} above target`,at:nowStamp()}); p.thread.push(['ai',`Reading saved: ${sy}/${di}. It is above your target, so your coordinator will review it today.`]); }
      else p.thread.push(['ai',`Reading saved: ${sy}/${di}. Well done, keep it up!`]); return; }
    if(r.sev==='sugar'){ const v=+(m[1]||m[2]); (p.sug=p.sug||[]).push(v); if(v<70||v>300){ p.flags.push({sev:'crit',t:`Sugar ${v} reported`,at:nowStamp()}); p.thread.push(['ai',v<70?'Your sugar is low. Take 3 teaspoons of sugar or glucose in water now and recheck in 15 minutes. Your coordinator is calling you.':'Your sugar is very high. Your doctor has been alerted and your coordinator will call you now.']); } else p.thread.push(['ai',`Sugar ${v} saved. Thank you!`]); return; }
    p.flags.push({sev:r.sev,t:r.tag,at:nowStamp()}); p.thread.push(['ai',r.reply]);
    if(r.sev==='crit') state.audit.push({t:nowStamp(),who:'Setu triage',what:`${p.name} · red flag "${r.tag}" escalated to doctor and coordinator`});
    return; }
  p.thread.push(['ai','Thank you! I have noted this for your coordinator. For anything urgent, call 108 or the nursing home.']);
}

  if(t.dataset.f && c){ set(c,t.dataset.f, t.type==='number'?t.value:t.value); recheck();
    if(['v.h','v.w','l.creat','p.age'].includes(t.dataset.f) || t.dataset.f==='v.npo'){ /* refresh computed fields without losing focus */
      const e=evaluate(c); document.querySelectorAll('.computed').forEach((el,i)=>{ const lbl=el.previousElementSibling?.textContent||''; if(/BMI/.test(lbl)) el.textContent=e.bmi?e.bmi.toFixed(1):'—'; if(/eGFR/.test(lbl)) el.textContent=e.egfr?Math.round(e.egfr)+' mL/min/1.73m²':'—'; }); }
    if(t.dataset.f==='p.name'){ $('#pageTitle').textContent='Pre-admission · '+(c.p.name||'New patient'); }
  }
  if(t.dataset.med!==undefined && c){ c.meds[+t.dataset.med][t.dataset.k]=t.value; if(t.dataset.k==='n'){ const r=$('#rec-'+t.dataset.med); if(r) r.innerHTML=recHtml(identify(t.value)); } recheck(); }
});
document.addEventListener('change', ev=>{
  const t=ev.target, c=cur();
  if(t.dataset.c && c){ set(c,t.dataset.c,t.checked); t.closest('.chk')?.classList.toggle('on',t.checked); recheck(); }
  if(t.tagName==='SELECT' && t.dataset.f){ recheck(); }
});
document.addEventListener('click', ev=>{
  const el=ev.target.closest('[data-nav],[data-open],[data-act],[data-seg],[data-filter],[data-lang],[data-sug]'); if(!el) return;
  const c=cur();
  if(el.dataset.nav){ state.view=el.dataset.nav; render(); renderSugs(); return; }
  if(el.dataset.open){ openCase(el.dataset.open); return; }
  if(el.dataset.seg){ set(c,el.dataset.seg,el.dataset.val); if(el.dataset.seg==='a.type'){ if(c.a.type==='medical') c.a.anaes='None'; else if(c.a.anaes==='None') c.a.anaes=c.a.type==='maternity'?'Spinal':'GA'; } $('#stepBody').innerHTML=stepBody(state.step); recheck(); return; }
  if(el.dataset.filter){ state.filter=el.dataset.filter; renderPanel(); return; }
  if(el.dataset.lang){ state.lang=el.dataset.lang; $('#stepBody').innerHTML=stepBody(6); return; }
  if(el.dataset.sug){ ask(el.dataset.sug); return; }
  const a=el.dataset.act;
  if(a==='new'){ const n=blankCase(); state.cases.unshift(n); state.audit.push({t:nowStamp(),who:'Front desk',what:`${n.id} · new pre-admission started`}); openCase(n.id); return; }
  if(a==='go'){ state.step=Math.min(6,+el.dataset.s); render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(a==='addmed'){ c.meds.push({n:'',d:'',f:''}); c.noMeds=false; $('#stepBody').innerHTML=stepBody(4); const ins=document.querySelectorAll('[data-k="n"]'); ins[ins.length-1]?.focus(); recheck(); return; }
  if(a==='delmed'){ c.meds.splice(+el.dataset.i,1); $('#stepBody').innerHTML=stepBody(4); recheck(); return; }
  if(a==='review'){ const fl=evaluate(c).flags.find(x=>x.id===el.dataset.id); state.modalFlag=fl.id; $('#mTitle').textContent=(fl.sev==='crit'?'Critical: ':'')+fl.title; $('#mText').textContent=fl.detail; $('#mReason').value=''; $('#modal').classList.add('open'); setTimeout(()=>$('#mReason').focus(),50); return; }
  if(a==='mclose'){ $('#modal').classList.remove('open'); return; }
  if(a==='msave'){ const r=$('#mReason').value.trim(), by=$('#mBy').value.trim(); if(!r||!by){ toast('Add who reviewed it and the decision'); return; } const fl=evaluate(c).flags.find(x=>x.id===state.modalFlag); c.overrides[state.modalFlag]={by,reason:r,at:nowStamp()}; state.audit.push({t:nowStamp(),who:by,what:`${c.id} ${c.p.name} · reviewed "${fl.title}": ${r}`}); $('#modal').classList.remove('open'); render(); toast('Review recorded in the audit trail'); return; }
  if(a==='sign'){ c.finalized=`${nowStamp()} · ${c.a.doctor||'Doctor'}`; state.audit.push({t:nowStamp(),who:c.a.doctor||'Doctor',what:`${c.id} ${c.p.name} · signed off for admission (checklist ${evaluate(c).score}%)`}); render(); toast('Signed off. Ward and OT notified.'); return; }
  if(a==='send'){ state.audit.push({t:nowStamp(),who:'Nurse Anita',what:`${c.id} ${c.p.name} · instruction card sent on WhatsApp (${state.lang==='hi'?'Hindi':'English'})`}); toast('Sent on WhatsApp (simulated)'); return; }
  if(a==='copy'){ navigator.clipboard?.writeText($('#briefTxt').textContent).then(()=>toast('Brief copied'),()=>toast('Copy not available here')); return; }
});
$('#fab').onclick=()=>{ $('#chat').classList.add('open'); $('#fab').style.display='none'; renderSugs(); if(!$('#chatBody').children.length) chatAdd('ai',"Namaste! I'm Setu, the CareSetu assistant. I help across the journey: pre-admission checks, ward documentation, discharge packs and the 90-day follow-up.\n\nI support your team; the doctor always decides."); $('#chatIn').focus(); };
$('#chatClose').onclick=()=>{ $('#chat').classList.remove('open'); $('#fab').style.display=''; };
$('#chatForm').onsubmit=e=>{ e.preventDefault(); const q=$('#chatIn').value; $('#chatIn').value=''; ask(q); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#modal').classList.remove('open'); });


/* top bar: date, red-flag count, patient search */
function refreshTopbar(){ const d=new Date(); const dt=$('#tbDate'); if(dt) dt.textContent=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})+' · '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  const b=$('#tbBell'); if(b) b.textContent=CP.reduce((a,x)=>a+x.flags.filter(f=>f.sev==='crit').length,0)+CP.filter(x=>cpRisk(x).level==='High'&&!x.flags.length).length; }
const _render=render; render=function(){ _render(); refreshTopbar(); };
document.addEventListener('keydown',e=>{ if(e.target.id!=='tbSearch'||e.key!=='Enter') return; const q=e.target.value.trim().toLowerCase(); if(!q) return;
  const pre=state.cases.find(c=>(c.p.name+' '+c.p.phone).toLowerCase().includes(q)); if(pre){ openCase(pre.id); return; }
  const w=WARD.find(x=>(x.name+' '+x.bed).toLowerCase().includes(q)); if(w){ state.view='ward'; render(); return; }
  const p=CP.find(x=>x.name.toLowerCase().includes(q)); if(p){ state.cpSel=p.id; state.view='cp'; render(); return; }
  toast('No patient found for “'+e.target.value+'”'); });

demo(); Object.assign(state,{view:'today',dcSel:null,dcLang:'en',dcDone:{},dcApproved:{},dcCons:{},cpSel:null}); render(); renderSugs();
</script>
